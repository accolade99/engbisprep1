<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 7 English Entrance Challenge 1</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7ee;--card:#fff;--ink:#1a1a1a;--mute:#5a5a5a;--acc:#b8322a;--gold:#d69946;--tint:rgba(214,153,70,.16);--line:#e6dfd0;--ok:#1f8a4c;--bad:#c0152a}
@media (prefers-color-scheme:dark){:root{--bg:#151212;--card:#211c1c;--ink:#f3eeee;--mute:#b3aaaa;--acc:#e2584c;--gold:#e6b04f;--tint:rgba(230,176,79,.16);--line:#3a3232;--ok:#4cd08a;--bad:#ff6b78}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.55 'Nunito',system-ui,sans-serif}
header{background:#fff;border-bottom:3px solid var(--acc)}
.hd{max-width:760px;margin:0 auto;padding:.55rem 1rem}
.hd img{display:block;height:clamp(36px,9vw,50px);width:auto}
main{max-width:760px;margin:0 auto;padding:1.2rem 1rem 2.5rem}
h1{font:900 clamp(1.7rem,6vw,2.4rem) 'Fraunces',Georgia,serif;margin:.2rem 0}
h1 span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 1rem}
#prog{position:sticky;top:0;z-index:5;background:var(--bg);padding:.5rem 0;border-bottom:2px solid var(--gold);font-weight:800;display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
h2{font:700 1.15rem 'Fraunces',Georgia,serif;color:var(--acc);margin:1.8rem 0 .6rem;padding-bottom:.2rem;border-bottom:1px solid var(--gold)}
.ps{background:var(--tint);border-radius:12px;padding:.9rem 1.1rem;margin:.5rem 0;font-family:Georgia,serif;font-size:1rem}
.ps p{margin:0 0 .6rem}
.ps p:last-child{margin:0}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;margin:.8rem 0}
.q p{margin:.2rem 0 .5rem}
.n{display:inline-block;background:var(--acc);color:#fff;font-weight:800;font-size:.85rem;border-radius:50%;min-width:1.7rem;height:1.7rem;text-align:center;line-height:1.7rem;margin-right:.5rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.45rem;margin-top:.5rem}
.opts button{display:flex;align-items:center;justify-content:center;gap:.35rem;font:700 .95rem 'Nunito',sans-serif;color:var(--ink);background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:.5rem .35rem;cursor:pointer;transition:.2s}
.opts button b{color:var(--acc)}
.opts button:hover{border-color:var(--acc)}
.opts button.sel{border-color:var(--gold);background:var(--tint)}
.opts button.ok{border-color:var(--ok);background:rgba(31,138,76,.14)}
.opts button.no{border-color:var(--bad);background:rgba(192,21,42,.1)}
.opts button.ok::after{content:'✔';color:var(--ok)}
.opts button.no::after{content:'✘';color:var(--bad)}
.w{display:none;margin-top:.6rem;font-size:.9rem;color:var(--mute)}
.chk .w{display:block}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem}
.act{font:800 1rem 'Nunito',sans-serif;border:0;border-radius:10px;padding:.65rem 1.3rem;cursor:pointer;background:var(--acc);color:#fff;transition:.2s}
.act:hover{filter:brightness(1.12)}
.act.o{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
#res{font:900 1.05rem 'Fraunces',Georgia,serif;color:var(--acc)}
footer{max-width:760px;margin:0 auto;padding:0 1rem 2rem;color:var(--mute);font-size:.8rem}
</style>
</head>

const P1=`<p>Every evening at dusk, old Mr Adeyemi climbed the one hundred and twelve steps of the Ikoyi lighthouse, his knees creaking like the rusted hinges of the door below. He had kept the lamp burning for thirty-one years, through blistering heat and violent storms, and he regarded the great lens as a living thing that demanded patient care.</p><p>That night, however, the sea was unusually calm, and a thin mist hovered above the water like a pale shroud. As he polished the glass, he noticed a tiny light flickering far out in the bay. It was not a star, nor a fishing boat; it blinked in an erratic, desperate rhythm. Mr Adeyemi hesitated, his hand trembling above the radio. Years ago, he had ignored a similar signal and been haunted by the memory ever since. Without further delay, he seized the microphone and called the coastguard, whispering a silent prayer that he was not too late.</p>`;
const P2=`<p>Honeybees are among the most industrious creatures on Earth. A single worker may visit up to two thousand flowers in a day, collecting nectar which she carries back to the hive in a special “honey stomach”. Back home, she performs a “waggle dance”, whose angle and duration tell her sisters precisely where the richest flowers can be found.</p><p>Although bees are tiny, their contribution is enormous: about one third of the food we eat depends, directly or indirectly, on pollination. Sadly, bee populations have declined in recent decades, largely because of habitat loss and the overuse of pesticides. Scientists therefore urge farmers to plant wildflowers and to reduce chemical sprays.</p>`;

/* ---------- Rendering ---------- */
const $=id=>document.getElementById(id),list=$('list'),N=Q.length,ans=[];let checked=false;
const count=()=>$('cnt').textContent=`Answered: ${ans.filter(a=>a!==undefined).length} / ${N}`;
function build(){
 list.innerHTML='';ans.length=0;checked=false;$('res').textContent='';count();
 Q.forEach((q,i)=>{
  if(S[i]){const h=document.createElement('div');h.innerHTML=`<h2>${S[i][0]}</h2>${S[i][1]?`<div class="ps">${S[i][1]}</div>`:''}`;list.appendChild(h)}
  const d=document.createElement('div');d.className='q';
  d.innerHTML=`<p><span class="n">${i+1}</span>${q.t}</p><div class="opts">${q.o.map((o,k)=>`<button data-k="${k}"><b>${'ABCD'[k]}</b> ${o}</button>`).join('')}</div><div class="w">✔ ${q.w}</div>`;
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>{
   if(checked)return;
   d.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
   b.classList.add('sel');ans[i]=+b.dataset.k;count()});
  list.appendChild(d)});
}
$('chk').onclick=()=>{
 checked=true;let sc=0;
 list.querySelectorAll('.q').forEach((d,i)=>{
  d.classList.add('chk');
  d.querySelectorAll('button').forEach((b,k)=>{b.classList.remove('sel');
   if(k===Q[i].c)b.classList.add('ok');else if(ans[i]===k)b.classList.add('no')});
  if(ans[i]===Q[i].c)sc++});
 const m=sc>=36?'Outstanding!':sc>=30?'Excellent work!':sc>=22?'Good effort, keep practising.':'Review the solutions and try again.';
 $('res').textContent=`Score: ${sc} / ${N}. ${m}`;
 window.scrollTo({top:0,behavior:'smooth'});
};
$('rst').onclick=()=>{build();window.scrollTo({top:0,behavior:'smooth'})};
